<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PGP Security (Professional Guard & Patrol) provides licensed armed and unarmed guards, mobile patrol, and 24/7 alarm response across Greater Houston. Trusted since 1985."
    />
    <link rel="icon" type="image/webp" href="/pgp-logo.webp" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <title>PGP Security - Houston</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = 'light';
          document.documentElement.classList.add(t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
